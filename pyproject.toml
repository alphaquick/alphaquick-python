[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "alphaquick"
version = "0.1.0"
description = "Read AlphaQuick market data files: L2 depth & trades, and the Hyperliquid order log (L3)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "AlphaQuick" }]
keywords = ["market data", "order book", "hyperliquid", "order log", "l2", "l3", "tick data", "lz4"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["lz4>=4.0"]

[project.optional-dependencies]
pandas = ["pandas>=2.0", "pyarrow>=14"]
test = ["pytest>=7"]

[project.scripts]
alphaquick = "alphaquick.cli:main"

[project.urls]
Homepage = "https://alphaquick.io"
Documentation = "https://docs.alphaquick.io/data/libraries"
Source = "https://github.com/alphaquick/alphaquick-python"
Issues = "https://github.com/alphaquick/alphaquick-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/alphaquick"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["samples: reads the free sample files (downloaded once into the cache)"]
